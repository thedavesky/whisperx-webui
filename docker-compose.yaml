services:
  whisperx-webui:
    container_name: whisperx-webui
    build: .
    
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./configs:/app/configs

    ports:
      - "7860:7860"

    stdin_open: true
    tty: true

    environment:
      - COMMANDLINE_ARGS=--server_port 7860 --server_name 0.0.0.0
      - TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
